services:
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/prestint
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    environment:
      # Browser -> /api/* -> Vite proxy -> docker network -> backend
      VITE_API_URL: "/api"
      VITE_PROXY_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

  db:
    image: postgres:17
    environment:
      # Please change these credentials for obvious security reasons
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prestint
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
