networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  mail_mock:
    driver: bridge
    internal: true

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # Redirecting from http:// to https://
      - "443:443"
    volumes:
      - ./apps/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - edge
      - mail_mock
    healthcheck:
      # Healthy when internal Certificate exists
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEV_DOCS: ${DEV_DOCS}
      OTP_SECRET: ${OTP_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BASE_URL: ${BASE_URL:-https://prestint.localhost}
      OTP_DEV_LOG: ${OTP_DEV_LOG:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Host code is live in the container; the image's .venv is kept
      - ./apps/backend:/app
      - /app/.venv
    # No --no-sync: a uv.lock change only needs a restart, not a rebuild
    # Migrations run on every container start (no-op when up to date); --reload doesn't rerun them,
    # so a new migration file needs `docker compose restart backend`
    command: sh -c "uv run alembic upgrade head && uv run uvicorn --app-dir src main:app --host 0.0.0.0 --reload"
    networks:
      - edge
      - data
      - mail_mock
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    environment:
      # Browser -> /api/* -> Vite proxy -> docker network -> backend
      VITE_API_URL: "/api"
      VITE_PROXY_TARGET: "http://backend:8000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - edge

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data

  # Catches every outgoing mail (no real delivery); UI at https://mail.prestint.localhost
  mailpit:
    image: axllent/mailpit
    networks:
      - mail_mock

volumes:
  postgres_data:
  caddy_data:
